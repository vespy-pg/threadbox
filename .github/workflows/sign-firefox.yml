name: Sign Firefox extension

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run extension:build
      - name: Request an unlisted Mozilla signature
        run: npx web-ext sign --channel unlisted --source-dir dist/extension/firefox --artifacts-dir dist/extension/signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: threadbox-firefox-signed
          path: dist/extension/signed/*.xpi
