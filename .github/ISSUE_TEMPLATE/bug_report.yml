name: Bug report
description: Report a reproducible problem in Threadbox.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Threadbox version
      placeholder: 0.1.14
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and desktop session
      placeholder: Ubuntu 22.04, GNOME, X11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
