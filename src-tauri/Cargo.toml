[package]
name = "threadbox"
version = "0.1.15"
description = "A local-first task inbox for messages, screenshots, and voice notes"
authors = ["Threadbox contributors"]
edition = "2021"

[lib]
name = "threadbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "threadbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
directories = "5"
hound = "3.5"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
