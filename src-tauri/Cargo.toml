[package]
name = "threadbox"
version = "0.1.16"
description = "A local-first task inbox for messages, screenshots, and voice notes"
authors = ["Threadbox contributors"]
edition = "2021"

[lib]
name = "threadbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "threadbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = { version = "0.18", default-features = false }
directories = "5"
hound = "3.5"
keyring = { version = "3", default-features = false }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
whisper-rs = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
cpal = { version = "0.18", default-features = false, features = ["pulseaudio"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
notify-rust = "4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
